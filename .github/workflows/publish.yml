name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) { throw new Error('Tag must be v' + version); }"
      - name: Check
        run: npm run check
        env:
          CI: true
      - name: Check whether this version is already published
        id: registry
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "typed-css-modules-next@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "typed-css-modules-next@$PACKAGE_VERSION is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish
